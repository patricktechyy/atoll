name: Release

# Publish a Release on GitHub (Releases -> Draft a new release -> choose a NEW tag like v0.11.0 -> Publish).
# This workflow then builds both platforms and attaches the files the in-app updater reads:
#   Windows: Atoll-Setup-<version>.exe, latest.yml, .blockmap     (legacy + Rust updater)
#   macOS:   Atoll-macOS-arm64.zip, latest-mac.json               (legacy + Rust updater)
# The tag must be v<version in app/package.json>, and CHANGELOG.md needs a "## <version>" section.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build, for example v0.11.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  check:
    name: Check tag and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: v
        run: |
          node tools/release-notes.js check "$TAG"
          echo "version=$(node -p "require('./app/package.json').version")" >> "$GITHUB_OUTPUT"
      - run: node tools/release-notes.js notes "${{ steps.v.outputs.version }}" > /dev/null

  mac:
    name: macOS build
    needs: check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.87.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: npm ci --prefix app
      - run: npm test --prefix app
      - run: npm run test:rust --prefix app
      - run: npm run build:rust --prefix app
      - name: UI tests on the built app
        env:
          ATOLL_RUST_APP: ${{ github.workspace }}/rust/target/release/bundle/macos/Atoll.app
        run: npm run test:rust:ui --prefix app
      - name: Package and write the update feed
        run: |
          node tools/rust-release.js
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/rust/Atoll-macOS-arm64.zip dist/rust/Atoll-macOS-arm64.zip.sha256 dist/rust/latest-mac.json --clobber

  windows:
    name: Windows build
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.87.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: npm ci --prefix app
      - run: npm test --prefix app
      - run: npm run test:rust --prefix app
      - name: Build the Rust installer
        run: npm run build:rust --prefix app
      - name: Test the packaged Windows app and updater before publishing
        env:
          ATOLL_RUST_APP: ${{ github.workspace }}\rust\target\release\Atoll.exe
        run: npm run test:rust:ui --prefix app
      - name: Package compatible update feeds
        run: node tools/rust-release.js
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls dist/rust
          gh release upload "$TAG" "dist/rust/Atoll-Setup-${{ needs.check.outputs.version }}.exe" "dist/rust/Atoll-Setup-${{ needs.check.outputs.version }}.exe.blockmap" dist/rust/latest.yml --clobber

  notes:
    name: Release notes
    needs: [check, mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Put the changelog section in the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/release-notes.js notes "${{ needs.check.outputs.version }}" > notes.md
          gh release edit "$TAG" --notes-file notes.md
