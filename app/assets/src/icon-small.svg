<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- simplified for 16–32 px: bigger island, brighter dot, no fine rings -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b3d5a"/><stop offset="1" stop-color="#07111c"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy="1.1" r=".8"><stop offset="0" stop-color="#30d5c8" stop-opacity=".6"/><stop offset="1" stop-color="#30d5c8" stop-opacity="0"/></radialGradient>
    <clipPath id="tile"><rect width="256" height="256" rx="56"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#bg)"/><rect width="256" height="256" fill="url(#glow)"/>
    <rect x="22" y="80" width="212" height="96" rx="48" fill="#000"/>
    <rect x="62" y="108" width="16" height="40" rx="8" fill="#30d5c8"/>
    <rect x="90" y="96" width="16" height="64" rx="8" fill="#30d5c8"/>
    <circle cx="180" cy="128" r="22" fill="#5ff0e3"/>
  </g>
</svg>
