[package]
name = "atoll-desktop"
version = "0.0.0"
rust-version = "1.87"
edition = "2021"
build = "build.rs"

[[bin]]
name = "Atoll"
path = "src/main.rs"

[lib]
name = "atoll_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png", "image-ico", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-drag = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
url = "2"
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.33"
arboard = { version = "3", features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
rand = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_yaml = "0.9"
futures-util = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"

# Keep build-time proc-macro dylibs loadable on macOS 27 (rust-lang/rust#157750).
[profile.release.build-override]
strip = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_DataExchange", "Win32_Foundation", "Win32_System_Power", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
